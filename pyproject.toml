[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "odoo-mcp"
version = "0.1.0"
description = "Workflow-native MCP server for Odoo Enterprise."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "EBMURHA" }]
requires-python = ">=3.11"
dependencies = [
    "cryptography==50.0.1",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "mcp==2.2.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "PyJWT==2.14.0",
    "PyYAML==6.0.3",
    "uvicorn==0.53.0",
]

[project.optional-dependencies]
dev = [
    "build==1.3.0",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.3.0",
    "ruff==0.16.7",
    "types-PyYAML==6.0.12.20260906",
]

[project.scripts]
odoo-mcp = "odoo_mcp.app.main:main"
odoo-mcp-admin = "odoo_mcp.app.operations:main"

[project.urls]
Homepage = "https://github.com/ebmurha/odoo-mcp"
Repository = "https://github.com/ebmurha/odoo-mcp"
Issues = "https://github.com/ebmurha/odoo-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/odoo_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/.env.example",
    "/.env.shared.example",
    "/.github",
    "/.gitignore",
    "/LICENSE",
    "/NOTICE",
    "/README.md",
    "/SECURITY.md",
    "/SUPPORT.md",
    "/CONTRIBUTING.md",
    "/CHANGELOG.md",
    "/Dockerfile",
    "/docker-compose.yml",
    "/.dockerignore",
    "/config",
    "/deploy",
    "/docs",
    "/server.json",
    "/pyproject.toml",
    "/scripts",
    "/src",
    "/tests",
    "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["odoo_mcp"]
mypy_path = "src"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "build==1.3.0",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.3.0",
    "ruff==0.16.7",
    "types-PyYAML==6.0.12.20260906",
]
