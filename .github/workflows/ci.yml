name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ODOO_MCP_TEST_POSTGRES_URL: postgresql://postgres:synthetic-test-password@127.0.0.1:5432/odoo_mcp_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: synthetic-test-password
          POSTGRES_DB: odoo_mcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d odoo_mcp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv build
      - run: uv run python scripts/verify_docker.py
