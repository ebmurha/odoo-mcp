# Optional routing-only proxy. It owns no OAuth, connector, Odoo, or MCP state.
# Configure TLS on the server block before exposing it publicly.
server {
    listen 443 ssl;
    server_name mcp.example.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://odoo-mcp-shared:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }
}
